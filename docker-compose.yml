{
  "name": "neurogateway-local",
  "services":
    {
      "postgres":
        {
          "image": "postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336",
          "environment":
            {
              "POSTGRES_DB": "neurogateway",
              "POSTGRES_USER": "ngdev",
              "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:-local_dev_only}",
            },
          "ports": ["127.0.0.1:5432:5432"],
          "volumes": ["postgres-data:/var/lib/postgresql"],
          "healthcheck":
            {
              "test": ["CMD-SHELL", "pg_isready -U ngdev -d neurogateway"],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "restart": "unless-stopped",
        },
      "redis":
        {
          "image": "redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6",
          "command": ["redis-server", "--appendonly", "yes"],
          "ports": ["127.0.0.1:6379:6379"],
          "volumes": ["redis-data:/data"],
          "healthcheck":
            {
              "test": ["CMD", "redis-cli", "ping"],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "restart": "unless-stopped",
        },
      "clickhouse":
        {
          "image": "clickhouse/clickhouse-server:latest@sha256:bdb5c911a23d92fd364e246ab20b5a0a485f00112f3663fa626b083fb46c146b",
          "environment":
            {
              "CLICKHOUSE_USER": "ngdev",
              "CLICKHOUSE_PASSWORD": "${CLICKHOUSE_PASSWORD:-local_dev_only}",
              "CLICKHOUSE_DB": "neurogateway",
            },
          "ports": ["127.0.0.1:8123:8123"],
          "volumes":
            [
              "clickhouse-data:/var/lib/clickhouse",
              "./deploy/clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro",
            ],
          "healthcheck":
            {
              "test":
                [
                  "CMD-SHELL",
                  'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"',
                ],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "restart": "unless-stopped",
        },
      "nats":
        {
          "image": "nats:alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6",
          "command": ["-js", "-sd", "/data", "-m", "8222"],
          "ports": ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"],
          "volumes": ["nats-data:/data"],
          "healthcheck":
            {
              "test":
                [
                  "CMD-SHELL",
                  "wget -q -O /dev/null http://127.0.0.1:8222/healthz",
                ],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "restart": "unless-stopped",
        },
      "minio":
        {
          "build": { "context": ".", "dockerfile": "deploy/Dockerfile.minio" },
          "environment":
            {
              "MINIO_ROOT_USER": "${MINIO_ROOT_USER:-ngdev}",
              "MINIO_ROOT_PASSWORD": "${MINIO_ROOT_PASSWORD:-local_dev_only_change_me}",
            },
          "ports": ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"],
          "volumes": ["minio-data:/data"],
          "healthcheck":
            {
              "test":
                [
                  "CMD-SHELL",
                  "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live",
                ],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "restart": "unless-stopped",
        },
      "mailpit":
        {
          "image": "axllent/mailpit:latest@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387",
          "ports": ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"],
          "healthcheck":
            {
              "test": ["CMD", "/mailpit", "readyz"],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "restart": "unless-stopped",
        },
      "gateway":
        {
          "build":
            {
              "context": ".",
              "dockerfile": "deploy/Dockerfile.service",
              "args": { "SERVICE": "gateway" },
            },
          "environment": { "PORT": "8080", "BIND_ADDRESS": "0.0.0.0" },
          "ports": ["127.0.0.1:8080:8080"],
          "healthcheck":
            {
              "test":
                [
                  "CMD-SHELL",
                  "wget -q -O /dev/null http://127.0.0.1:8080/healthz",
                ],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "depends_on":
            {
              "postgres": { "condition": "service_healthy" },
              "redis": { "condition": "service_healthy" },
              "mock-provider": { "condition": "service_healthy" },
            },
          "restart": "unless-stopped",
        },
      "api":
        {
          "build":
            {
              "context": ".",
              "dockerfile": "deploy/Dockerfile.service",
              "args": { "SERVICE": "api" },
            },
          "environment": { "PORT": "8080", "BIND_ADDRESS": "0.0.0.0" },
          "ports": ["127.0.0.1:8081:8080"],
          "healthcheck":
            {
              "test":
                [
                  "CMD-SHELL",
                  "wget -q -O /dev/null http://127.0.0.1:8080/healthz",
                ],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "depends_on": { "postgres": { "condition": "service_healthy" } },
          "restart": "unless-stopped",
        },
      "billing-worker":
        {
          "build":
            {
              "context": ".",
              "dockerfile": "deploy/Dockerfile.service",
              "args": { "SERVICE": "billing-worker" },
            },
          "environment": { "PORT": "8080", "BIND_ADDRESS": "0.0.0.0" },
          "ports": ["127.0.0.1:8082:8080"],
          "healthcheck":
            {
              "test":
                [
                  "CMD-SHELL",
                  "wget -q -O /dev/null http://127.0.0.1:8080/healthz",
                ],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "depends_on":
            {
              "postgres": { "condition": "service_healthy" },
              "nats": { "condition": "service_healthy" },
            },
          "restart": "unless-stopped",
        },
      "mock-provider":
        {
          "build":
            {
              "context": ".",
              "dockerfile": "deploy/Dockerfile.service",
              "args": { "SERVICE": "mock-provider" },
            },
          "environment": { "PORT": "8080", "BIND_ADDRESS": "0.0.0.0" },
          "ports": ["127.0.0.1:8089:8080"],
          "healthcheck":
            {
              "test":
                [
                  "CMD-SHELL",
                  "wget -q -O /dev/null http://127.0.0.1:8080/healthz",
                ],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "restart": "unless-stopped",
        },
      "web":
        {
          "build": { "context": ".", "dockerfile": "deploy/Dockerfile.web" },
          "environment": { "NEXT_TELEMETRY_DISABLED": "1" },
          "ports": ["127.0.0.1:3000:3000"],
          "healthcheck":
            {
              "test":
                [
                  "CMD-SHELL",
                  "wget -q -O /dev/null http://127.0.0.1:3000/healthz",
                ],
              "interval": "5s",
              "timeout": "5s",
              "retries": 30,
              "start_period": "10s",
            },
          "restart": "unless-stopped",
        },
    },
  "volumes":
    {
      "postgres-data": {},
      "redis-data": {},
      "clickhouse-data": {},
      "nats-data": {},
      "minio-data": {},
    },
}
