  "components":
    {
      "securitySchemes":
        {
          "SessionAuth":
            {
              "type": "apiKey",
              "in": "cookie",
              "name": "ng_session",
              "description": "HttpOnly Secure SameSite session; mutating calls also require X-CSRF-Token.",
            },
        },
      "schemas":
        {
          "Usage":
            {
              "type": "object",
              "properties":
                {
                  "prompt_tokens": { "type": "integer", "minimum": 0 },
                  "completion_tokens": { "type": "integer", "minimum": 0 },
                  "total_tokens": { "type": "integer", "minimum": 0 },
                  "cached_tokens": { "type": "integer", "minimum": 0 },
                  "cache_write_tokens": { "type": "integer", "minimum": 0 },
                  "reasoning_tokens": { "type": "integer", "minimum": 0 },
                  "audio_input_tokens": { "type": "integer", "minimum": 0 },
                  "audio_output_tokens": { "type": "integer", "minimum": 0 },
                  "image_input_tokens": { "type": "integer", "minimum": 0 },
                  "image_output_tokens": { "type": "integer", "minimum": 0 },
                },
              "required":
                ["prompt_tokens", "completion_tokens", "total_tokens"],
              "additionalProperties": false,
            },
          "Error":
            {
              "type": "object",
              "properties":
                {
                  "error":
                    {
                      "type": "object",
                      "properties":
                        {
                          "message": { "type": "string" },
                          "type": { "type": "string" },
                          "param": { "type": ["string", "null"] },
                          "code": { "type": ["string", "null"] },
                        },
                      "required": ["message", "type", "param", "code"],
                      "additionalProperties": false,
                    },
                },
              "required": ["error"],
              "additionalProperties": false,
            },
          "Generation":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "model": { "type": "string" },
                  "status":
                    {
                      "enum": ["held", "captured", "released", "failed"],
                      "type": "string",
                    },
                  "amount_microkopecks":
                    { "type": "string", "pattern": "^[0-9]+$" },
                  "usage": { "$ref": "#/components/schemas/Usage" },
                },
              "required": ["id", "model", "status"],
              "additionalProperties": false,
            },
          "KeyInfo":
            {
              "type": "object",
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "enabled": { "type": "boolean" },
                  "rpm_limit": { "type": "integer", "minimum": 0 },
                  "budget_microkopecks":
                    { "type": "string", "pattern": "^[0-9]+$" },
                },
              "required": ["id", "name", "enabled"],
              "additionalProperties": false,
            },
          "Credits":
            {
              "type": "object",
              "properties":
                {
                  "currency": { "const": "RUB", "type": "string" },
                  "available_microkopecks":
                    { "type": "string", "pattern": "^[0-9]+$" },
                  "held_microkopecks":
                    { "type": "string", "pattern": "^[0-9]+$" },
                },
              "required":
                ["currency", "available_microkopecks", "held_microkopecks"],
              "additionalProperties": false,
            },
          "Credentials":
            {
              "type": "object",
              "properties":
                {
                  "email": { "type": "string", "format": "email" },
                  "password": { "type": "string", "minLength": 12 },
                },
              "required": ["email", "password"],
              "additionalProperties": false,
            },
          "Account":
            {
              "type": "object",
              "properties":
                { "id": { "type": "string" }, "email": { "type": "string" } },
              "required": ["id", "email"],
              "additionalProperties": false,
            },
          "CreateKey":
            {
              "type": "object",
              "properties":
                {
                  "name": { "type": "string" },
                  "rpm_limit": { "type": "integer", "minimum": 0 },
                },
              "required": ["name"],
              "additionalProperties": false,
            },
          "IssuedKey":
            {
              "type": "object",
              "properties":
                { "id": { "type": "string" }, "secret": { "type": "string" } },
              "required": ["id", "secret"],
              "additionalProperties": false,
            },
          "Topup":
            {
              "type": "object",
              "properties":
                {
                  "amount_microkopecks":
                    { "type": "string", "pattern": "^[1-9][0-9]*$" },
                },
              "required": ["amount_microkopecks"],
              "additionalProperties": false,
            },
        },
    },
}
